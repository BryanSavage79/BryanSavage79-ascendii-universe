            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>

    const Percent = ({ size = 24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

            <circle cx="17.5" cy="17.5" r="2.5"/>
        </svg>
    );

    const Coins = ({ size = 24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="8" cy="8" r="6"/>

            <path d="m16.71 13.88.7.71-2.82 2.82"/>
        </svg>
    );

    const Download = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
    );

    const InterlinkEconomicSimulator = () => {
        const [supply, setSupply] = useState(100);
        const [effortPoints, setEffortPoints] = useState(50);
        const [componentValue, setComponentValue] = useState(1000);
        const [numSimulations, setNumSimulations] = useState(100);
        const [basePrice, setBasePrice] = useState(1);
        const [priceSlope, setPriceSlope] = useState(0.01);

        const calculatePrice = (s) => basePrice + (s * priceSlope);
        
        const calculateTotalCost = (targetSupply) => {
            let total = 0;
            for (let i = 0; i < targetSupply; i++) {
                total += calculatePrice(i);
            }
            return total;
        };

        const bondingCurveData = useMemo(() => {
            const data = [];
            for (let i = 0; i <= 200; i += 5) {
                data.push({
                    supply: i,
                    price: calculatePrice(i),
                    totalCost: calculateTotalCost(i)
                });
            }
            return data;
        }, [basePrice, priceSlope]);

        const calculateSuccessRate = (effort, value) => {
            const baseRate = 0.3;
            const effortBonus = Math.min(effort / 200, 0.4);
            const valueBonus = Math.min(value / 5000, 0.2);
            return Math.min(baseRate + effortBonus + valueBonus, 0.95);
        };

        const successRate = calculateSuccessRate(effortPoints, componentValue);

        const simulationResults = useMemo(() => {
            const results = { success: 0, failure: 0 };
            for (let i = 0; i < numSimulations; i++) {
                if (Math.random() < successRate) {
                    results.success++;
                } else {
                    results.failure++;
                }
            }
            return results;
        }, [numSimulations, successRate]);

        const profitabilityData = useMemo(() => {
            const scenarios = [];
            const craftingCost = componentValue;
            const legendaryValue = 10000;
            const rareValue = 3000;
            
            for (let effort = 0; effort <= 100; effort += 10) {
                const rate = calculateSuccessRate(effort, componentValue);
                const expectedValue = (rate * legendaryValue) + ((1 - rate) * 0.3 * rareValue);
                const profit = expectedValue - craftingCost;
                const roi = (profit / craftingCost) * 100;
                
                scenarios.push({
                    effort,
                    successRate: (rate * 100).toFixed(1),
                    expectedValue: expectedValue.toFixed(0),
                    profit: profit.toFixed(0),
                    roi: roi.toFixed(1)
                });
            }
            return scenarios;
        }, [componentValue]);

        const currentPrice = calculatePrice(supply);
        const totalValue = calculateTotalCost(supply);

        const downloadCSV = (data, filename) => {
            const csv = data.map(row => Object.values(row).join(',')).join('\n');
            const headers = Object.keys(data[0]).join(',');
            const csvContent = headers + '\n' + csv;
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            window.URL.revokeObjectURL(url);
        };

        const exportBondingCurve = () => {
            downloadCSV(bondingCurveData, 'bonding-curve-data.csv');
        };

        const exportProfitability = () => {
            downloadCSV(profitabilityData, 'profitability-analysis.csv');
        };

        const exportSimulationResults = () => {
            const data = [{
                effortPoints,
                componentValue,
                successRate: (successRate * 100).toFixed(2),
                numSimulations,
                successCount: simulationResults.success,
                failureCount: simulationResults.failure,
                actualSuccessRate: ((simulationResults.success / numSimulations) * 100).toFixed(2)
            }];
            downloadCSV(data, 'simulation-results.csv');
        };

        const exportAllData = () => {
            const summary = [{
                timestamp: new Date().toISOString(),
                supply,
                currentPrice: currentPrice.toFixed(4),
                totalValueLocked: totalValue.toFixed(4),
                basePrice,
                priceSlope,
                effortPoints,
                componentValue,
                successRate: (successRate * 100).toFixed(2),
                numSimulations,
                successCount: simulationResults.success,
                failureCount: simulationResults.failure
            }];
            downloadCSV(summary, 'interlink-economic-summary.csv');
        };

        return (
            <div className="w-full min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-6">
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                        <h1 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
                            🧬 Interlink Crafting Protocol
                        </h1>
                        <p className="text-gray-300 text-lg">Economic Simulator & Crafting Dashboard</p>
                        
                        <div className="flex flex-wrap justify-center gap-2 mt-4">
                            <button onClick={exportBondingCurve} className="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm">
                                <Download size={16} />
                                Export Bonding Curve
                            </button>
                            <button onClick={exportProfitability} className="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm">
                                <Download size={16} />
                                Export Profitability
                            </button>
                            <button onClick={exportSimulationResults} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm">
                                <Download size={16} />
                                Export Simulation
                            </button>
                            <button onClick={exportAllData} className="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm font-bold">
                                <Download size={16} />
                                Export All Data
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-slate-800 rounded-lg p-4 border border-purple-500/30">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-gray-400 text-sm">Current Price</p>
                                    <p className="text-2xl font-bold text-purple-400">{currentPrice.toFixed(2)} ETH</p>
                                </div>
                                <TrendingUp size={32} />
                            </div>
                        </div>
                        
                        <div className="bg-slate-800 rounded-lg p-4 border border-blue-500/30">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-gray-400 text-sm">Success Rate</p>
                                    <p className="text-2xl font-bold text-blue-400">{(successRate * 100).toFixed(1)}%</p>
                                </div>
                                <Percent size={32} />
                            </div>
                        </div>
                        
                        <div className="bg-slate-800 rounded-lg p-4 border border-green-500/30">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-gray-400 text-sm">Total Value Locked</p>
                                    <p className="text-2xl font-bold text-green-400">{totalValue.toFixed(0)} ETH</p>
                                </div>
                                <DollarSign size={32} />
                            </div>
                        </div>
                        
                        <div className="bg-slate-800 rounded-lg p-4 border border-orange-500/30">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-gray-400 text-sm">Component Supply</p>
                                    <p className="text-2xl font-bold text-orange-400">{supply}</p>
                                </div>
                                <Coins size={32} />
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-slate-800 rounded-lg p-6 border border-purple-500/30">
                            <h2 className="text-xl font-bold text-purple-300 mb-4 flex items-center gap-2">
                                <TrendingUp size={24} />
                                Bonding Curve Parameters
                            </h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Component Supply: {supply}</label>
                                    <input type="range" min="0" max="200" value={supply} onChange={(e) => setSupply(Number(e.target.value))} className="w-full" />
                                </div>
                                
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Base Price: {basePrice} ETH</label>
                                    <input type="range" min="0.1" max="5" step="0.1" value={basePrice} onChange={(e) => setBasePrice(Number(e.target.value))} className="w-full" />
                                </div>
                                
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Price Slope: {priceSlope.toFixed(3)}</label>
                                    <input type="range" min="0.001" max="0.1" step="0.001" value={priceSlope} onChange={(e) => setPriceSlope(Number(e.target.value))} className="w-full" />
                                </div>
                            </div>

                            <div className="mt-6 p-4 bg-slate-700 rounded border border-purple-400/20">
                                <p className="text-sm text-gray-300">
                                    <strong className="text-purple-300">Formula:</strong> Price = {basePrice} + ({supply} × {priceSlope.toFixed(3)}) = <span className="text-purple-400 font-bold">{currentPrice.toFixed(3)} ETH</span>
                                </p>
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-lg p-6 border border-blue-500/30">
                            <h2 className="text-xl font-bold text-blue-300 mb-4 flex items-center gap-2">
                                <Flame />
                                Crafting Parameters
                            </h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Effort Points: {effortPoints}</label>
                                    <input type="range" min="0" max="200" value={effortPoints} onChange={(e) => setEffortPoints(Number(e.target.value))} className="w-full" />
                                </div>
                                
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Component Value: {componentValue} ETH</label>
                                    <input type="range" min="100" max="5000" step="100" value={componentValue} onChange={(e) => setComponentValue(Number(e.target.value))} className="w-full" />
                                </div>
                                
                                <div>
                                    <label className="text-gray-300 text-sm block mb-2">Monte Carlo Simulations: {numSimulations}</label>
                                    <input type="range" min="10" max="1000" step="10" value={numSimulations} onChange={(e) => setNumSimulations(Number(e.target.value))} className="w-full" />
                                </div>
                            </div>

                            <div className="mt-6 p-4 bg-slate-700 rounded border border-blue-400/20">
                                <p className="text-sm text-gray-300 mb-2">
                                    <strong className="text-blue-300">Success Rate:</strong> {(successRate * 100).toFixed(2)}%
                                </p>
                                <p className="text-xs text-gray-400">
                                    Base: 30% + Effort Bonus: {((Math.min(effortPoints / 200, 0.4)) * 100).toFixed(1)}% + Value Bonus: {((Math.min(componentValue / 5000, 0.2)) * 100).toFixed(1)}%
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 rounded-lg p-6 border border-purple-500/30">
                        <h2 className="text-xl font-bold text-purple-300 mb-4">Bonding Curve: Price vs Supply</h2>
                        <ResponsiveContainer width="100%" height={300}>
                            <LineChart data={bondingCurveData}>
                                <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                <XAxis dataKey="supply" stroke="#9CA3AF" />
                                <YAxis stroke="#9CA3AF" />
                                <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #6366f1' }} />
                                <Legend />
                                <Line type="monotone" dataKey="price" stroke="#a855f7" strokeWidth={3} name="Current Price" dot={false} />
                            </LineChart>
                        </ResponsiveContainer>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-slate-800 rounded-lg p-6 border border-green-500/30">
                            <h2 className="text-xl font-bold text-green-300 mb-4 flex items-center gap-2">
                                <Zap />
                                Monte Carlo Simulation Results
                            </h2>
                            <ResponsiveContainer width="100%" height={250}>
                                <BarChart data={[
                                    { outcome: 'Success', count: simulationResults.success },
                                    { outcome: 'Failure', count: simulationResults.failure }
                                ]}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                                    <XAxis dataKey="outcome" stroke="#9CA3AF" />
                                    <YAxis stroke="#9CA3AF" />
                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #10b981' }} />
                                    <Bar dataKey="count" fill="#10b981" />
                                </BarChart>
                            </ResponsiveContainer>
                            <div className="mt-4 text-center">
                                <p className="text-gray-300">
                                    Out of <span className="text-green-400 font-bold">{numSimulations}</span> attempts:
                                </p>
                                <p className="text-2xl font-bold text-green-400 mt-2">
                                    {simulationResults.success} Successes ({((simulationResults.success / numSimulations) * 100).toFixed(1)}%)
                                </p>
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-lg p-6 border border-yellow-500/30">
                            <h2 className="text-xl font-bold text-yellow-300 mb-4">Profitability by Effort Level</h2>
                            <div className="overflow-auto max-h-80">
                                <table className="w-full text-sm">
                                    <thead className="bg-slate-700 sticky top-0">
                                        <tr>
                                            <th className="p-2 text-left text-gray-300">Effort</th>
                                            <th className="p-2 text-left text-gray-300">Success %</th>
                                            <th className="p-2 text-left text-gray-300">Expected Value</th>
                                            <th className="p-2 text-left text-gray-300">ROI %</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {profitabilityData.map((row, idx) => (
                                            <tr key={idx} className="border-t border-slate-700 hover:bg-slate-700/50">
                                                <td className="p-2 text-gray-300">{row.effort}</td>
                                                <td className="p-2 text-blue-400">{row.successRate}%</td>
                                                <td className="p-2 text-green-400">{row.expectedValue} ETH</td>
                                                <td className={`p-2 font-bold ${Number(row.roi) > 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                    {row.roi}%
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 rounded-lg p-6 border border-pink-500/30">
                        <h2 className="text-xl font-bold text-pink-300 mb-4">💡 Economic Insights</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div className="bg-slate-700 p-4 rounded border border-pink-400/20">
                                <h3 className="font-bold text-pink-300 mb-2">Optimal Strategy</h3>
                                <p className="text-gray-300">
                                    Max ROI at <span className="text-pink-400 font-bold">
                                        {profitabilityData.reduce((max, row) => Number(row.roi) > Number(max.roi) ? row : max).effort}
                                    </span> effort points with <span className="text-pink-400 font-bold">
                                        {profitabilityData.reduce((max, row) => Number(row.roi) > Number(max.roi) ? row : max).roi}%
                                    </span> return
                                </p>
                            </div>
                            
                            <div className="bg-slate-700 p-4 rounded border border-purple-400/20">
                                <h3 className="font-bold text-purple-300 mb-2">Market Depth</h3>
                                <p className="text-gray-300">
                                    Total cost to acquire {supply} components: <span className="text-purple-400 font-bold">{totalValue.toFixed(2)} ETH</span>
                                </p>
                            </div>
                            
                            <div className="bg-slate-700 p-4 rounded border border-blue-400/20">
                                <h3 className="font-bold text-blue-300 mb-2">Risk Assessment</h3>
                                <p className="text-gray-300">
                                    {successRate > 0.7 ? '🟢 High probability crafting' : successRate > 0.4 ? '🟡 Moderate risk' : '🔴 High risk crafting'}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    ReactDOM.render(<InterlinkEconomicSimulator />, document.getElementById('root'));
</script>
